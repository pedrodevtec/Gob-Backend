name: Pilot PostgreSQL integration

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pilot-db-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    name: Pilot isolated PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gob_test
          POSTGRES_PASSWORD: disposable_ci_only
          POSTGRES_DB: gob_pilot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gob_test -d gob_pilot_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      NODE_ENV: test
      JWT_SECRET: isolated-ci-test-only-not-a-production-secret
      PERMISSION_DEBUG: 'false'
      CHECKPOINT_DISABLE: '1'
      PRISMA_HIDE_UPDATE_MESSAGE: '1'
      DATABASE_URL: postgresql://placeholder.invalid/gob
      DIRECT_URL: postgresql://placeholder.invalid/gob
      TEST_DATABASE_URL: postgresql://gob_test:disposable_ci_only@localhost:5432/gob_pilot_test
      TEST_DIRECT_URL: postgresql://gob_test:disposable_ci_only@localhost:5432/gob_pilot_test
      TEST_DATABASE_CONFIRMED_DISPOSABLE: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Generate Prisma Client
        run: npm run prisma:generate
      - name: Apply migrations to disposable PostgreSQL
        run: DATABASE_URL="$TEST_DATABASE_URL" DIRECT_URL="$TEST_DIRECT_URL" npm run db:migrate:deploy
      - name: Session rotation and revocation with PostgreSQL
        env:
          RUN_AUTH_SESSION_DB_INTEGRATION: '1'
        run: DATABASE_URL="$TEST_DATABASE_URL" DIRECT_URL="$TEST_DIRECT_URL" npm run test:auth-session:integration
      - name: Atomic consent and membership with PostgreSQL
        env:
          RUN_CAMPAIGN_PARTICIPATION_DB_INTEGRATION: '1'
        run: npm run test:campaign-participation:integration
      - name: Atomic character draft with PostgreSQL
        env:
          RUN_CAMPAIGN_DRAFT_DB_INTEGRATION: '1'
        run: npm run test:campaign-character-draft:integration
      - name: Evidence boundary
        if: always()
        env:
          RESULT: ${{ job.status }}
        run: |
          echo "PostgreSQL integration result: $RESULT" >> "$GITHUB_STEP_SUMMARY"
          echo "Disposable service database only; no production credentials or deployment." >> "$GITHUB_STEP_SUMMARY"
          echo "This covers backend database integration, NOT browser E2E or real email. Frontend issue #42 remains open until those scenarios have evidence." >> "$GITHUB_STEP_SUMMARY"
